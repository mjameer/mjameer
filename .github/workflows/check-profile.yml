name: Weekly profile check

on:
  schedule:
    - cron: "0 13 * * 1"   # Mondays, 8 AM Central (13:00 UTC)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check images and links
        run: python .github/scripts/check_profile.py
