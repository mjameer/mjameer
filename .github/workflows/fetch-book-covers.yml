name: Fetch book covers (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Download covers from Open Library
        run: |
          mkdir -p assets/covers
          fetch() {  # slug isbn...
            slug=$1; shift
            for isbn in "$@"; do
              if curl -fsSL -o "assets/covers/$slug.jpg" "https://covers.openlibrary.org/b/isbn/$isbn-L.jpg?default=false"; then
                echo "OK $slug ($isbn) $(stat -c%s assets/covers/$slug.jpg) bytes"; return 0
              fi
            done
            echo "::warning::No cover found for $slug"; rm -f "assets/covers/$slug.jpg"
          }
          fetch refactoring 9780134757599
          fetch poeaa 9780321127426
          fetch pods 9780138221980
          fetch observability-engineering 9781492076445 9781492076438
          fetch learning-otel 9781098147181 9781098147174
          fetch dso 9781492033424 9781492033431
      - name: Commit covers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/covers
          git diff --cached --quiet || { git commit -m "Add book covers from Open Library"; git push; }
