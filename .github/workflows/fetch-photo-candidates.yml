name: Fetch photo candidates (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Download previews and license data from Wikimedia Commons
        run: |
          mkdir -p candidates
          python3 - <<'PY'
          import json, re, urllib.parse, urllib.request
          files = [
            "Code_on_computer_monitor_(Unsplash).jpg",
            "Programming_code.jpg",
            "Datacenter_Server_Racks_(22370909788).jpg",
            "Server_racks_-_IMG_3472.jpg",
            "Rear_of_rack_at_NERSC_data_center_-_closeup.jpg",
            "Technician_with_laptop_working_on_server_rack_at_NERSC.jpg",
            "19-inch_rackmount_Ethernet_switches_and_patch_panels.jpg",
            "Server_Rack_(54126210834).jpg",
            "UPS_Power_Management_Module,_racks_with_network_cabling_in_NERSC_data_center.jpg",
            "Half_filled_server_racks.jpg",
          ]
          UA = {"User-Agent": "mohiadeen-ameer-profile/1.0 (https://github.com/mohiadeen-ameer)"}
          meta = {}
          for i, f in enumerate(files, 1):
              q = urllib.parse.urlencode({"action": "query", "titles": "File:" + f, "prop": "imageinfo",
                                          "iiprop": "url|extmetadata", "iiurlwidth": "480", "format": "json"})
              data = json.load(urllib.request.urlopen(urllib.request.Request("https://commons.wikimedia.org/w/api.php?" + q, headers=UA)))
              page = next(iter(data["query"]["pages"].values()))
              if "imageinfo" not in page:
                  meta[f"{i:02d}"] = {"file": f, "error": "not found"}; continue
              info = page["imageinfo"][0]; em = info.get("extmetadata", {})
              strip = lambda k: re.sub("<[^>]+>", "", em.get(k, {}).get("value", "")).strip()
              open(f"candidates/{i:02d}.jpg", "wb").write(urllib.request.urlopen(urllib.request.Request(info["thumburl"], headers=UA)).read())
              meta[f"{i:02d}"] = {"file": f, "license": strip("LicenseShortName"), "license_url": strip("LicenseUrl"),
                                  "artist": strip("Artist"), "credit": strip("Credit"), "attribution_required": strip("AttributionRequired"),
                                  "page": info.get("descriptionurl")}
              print(i, f, meta[f"{i:02d}"]["license"])
          json.dump(meta, open("candidates/licenses.json", "w"), indent=2)
          PY
      - name: Push to a separate branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b photo-candidates
          git add candidates
          git commit -m "Photo candidates from Wikimedia Commons"
          git push -f origin photo-candidates
