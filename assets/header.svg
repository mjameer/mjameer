<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Mohiadeen Ameer — Principal Software Engineer, Platform and Infrastructure">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#0F1E36"/>
      <stop offset="1" stop-color="#0A2540"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36BCF7"/>
      <stop offset="1" stop-color="#7C9CFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#36BCF7" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#36BCF7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>

    <!-- Left: identity -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
      <text x="64" y="84" fill="#36BCF7" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" letter-spacing="3">$ whoami</text>
      <text x="62" y="146" fill="#F5F8FC" font-size="52" font-weight="700" letter-spacing="-0.5">Mohiadeen Ameer</text>
      <rect x="64" y="166" width="72" height="4" rx="2" fill="url(#accent)"/>
      <text x="64" y="208" fill="#C9D4E3" font-size="22" font-weight="600">Principal Software Engineer · Dell Technologies</text>
      <text x="64" y="244" fill="#8A9BB3" font-size="17">Distributed Systems  ·  Platform Engineering  ·  Infrastructure</text>
      <text x="64" y="276" fill="#5D6E87" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" letter-spacing="1">14 YEARS · GO · KAFKA · KUBERNETES · ROUND ROCK, TX</text>
    </g>

    <!-- Right: cluster diagram -->
    <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12">
      <!-- edges -->
      <g stroke="#36BCF7" stroke-opacity="0.35" stroke-width="1.5" fill="none">
        <path id="e1" d="M980 160 L860 92"/>
        <path id="e2" d="M980 160 L1100 92"/>
        <path id="e3" d="M980 160 L860 228"/>
        <path id="e4" d="M980 160 L1100 228"/>
        <path d="M860 92 L1100 92" stroke-dasharray="4 6"/>
        <path d="M860 228 L1100 228" stroke-dasharray="4 6"/>
      </g>

      <!-- packets travelling along edges -->
      <g fill="#7FD8FF">
        <circle r="3.5"><animateMotion dur="2.6s" repeatCount="indefinite" path="M980 160 L860 92"/></circle>
        <circle r="3.5"><animateMotion dur="3.1s" begin="0.6s" repeatCount="indefinite" path="M1100 92 L980 160"/></circle>
        <circle r="3.5"><animateMotion dur="2.8s" begin="1.1s" repeatCount="indefinite" path="M980 160 L860 228"/></circle>
        <circle r="3.5"><animateMotion dur="3.4s" begin="0.3s" repeatCount="indefinite" path="M1100 228 L980 160"/></circle>
      </g>

      <!-- control plane node -->
      <circle cx="980" cy="160" r="46" fill="none" stroke="#36BCF7" stroke-opacity="0.5">
        <animate attributeName="r" values="40;58;40" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.5;0;0.5" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="980" cy="160" r="38" fill="#0E2A47" stroke="url(#accent)" stroke-width="2"/>
      <text x="980" y="156" fill="#F5F8FC" text-anchor="middle" font-weight="700">k3s</text>
      <text x="980" y="172" fill="#8A9BB3" text-anchor="middle" font-size="10">control</text>

      <!-- service nodes -->
      <g>
        <rect x="806" y="72" width="108" height="40" rx="10" fill="#0E1B2E" stroke="#2B4466"/>
        <circle cx="824" cy="92" r="4" fill="#3DDC97"/>
        <text x="836" y="96" fill="#DDE6F2">Kafka</text>

        <rect x="1046" y="72" width="108" height="40" rx="10" fill="#0E1B2E" stroke="#2B4466"/>
        <circle cx="1064" cy="92" r="4" fill="#3DDC97"/>
        <text x="1076" y="96" fill="#DDE6F2">Valkey</text>

        <rect x="806" y="208" width="108" height="40" rx="10" fill="#0E1B2E" stroke="#2B4466"/>
        <circle cx="824" cy="228" r="4" fill="#3DDC97"/>
        <text x="836" y="232" fill="#DDE6F2">Postgres</text>

        <rect x="1046" y="208" width="108" height="40" rx="10" fill="#0E1B2E" stroke="#2B4466"/>
        <circle cx="1064" cy="228" r="4" fill="#3DDC97"/>
        <text x="1076" y="232" fill="#DDE6F2">OpenBao</text>
      </g>

      <!-- status blink -->
      <g fill="#3DDC97">
        <circle cx="824" cy="92" r="4"><animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
        <circle cx="1064" cy="228" r="4"><animate attributeName="opacity" values="1;0.25;1" dur="2.3s" repeatCount="indefinite"/></circle>
      </g>
    </g>
  </g>
</svg>
